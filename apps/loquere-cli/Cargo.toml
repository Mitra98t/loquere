[package]
name = "loquere-cli"
description = "Interfaccia a riga di comando per Loquere"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
loquere-chat = { path = "../../crates/loquere-chat" }
loquere-crypto = { path = "../../crates/loquere-crypto" }
loquere-identity = { path = "../../crates/loquere-identity" }
loquere-store = { path = "../../crates/loquere-store" }
loquere-wire = { path = "../../crates/loquere-wire" }
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Console"] }
