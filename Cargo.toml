[workspace]
resolver = "2"
members = [
    "crates/loquere-crypto",
    "crates/loquere-identity",
    "crates/loquere-store",
    "crates/loquere-wire",
    "crates/loquere-sim",
    "apps/loquere-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
argon2 = "0.5"
bytes = "1.12"
blake2 = "0.10"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2.2", features = ["rand_core", "zeroize"] }
hkdf = "0.12"
quinn-proto = { version = "0.11.19", default-features = false, features = ["rustls-ring"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rustls = { version = "0.23.36", default-features = false, features = ["std", "ring"] }
sha2 = "0.10"
subtle = "2.6"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
