# Licenze permissive compatibili con MIT OR Apache-2.0.
[licenses]
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "ISC", "Unicode-3.0"]

# OpenMLS usa hpke-rs sotto MPL-2.0: l'eccezione è limitata a queste crate.
# La distribuzione deve rispettare gli obblighi MPL sui relativi file.
[[licenses.exceptions]]
name = "hpke-rs"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "hpke-rs-crypto"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "hpke-rs-rust-crypto"
allow = ["MPL-2.0"]
